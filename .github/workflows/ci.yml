name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the superseded run. Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  lint:
    name: ruff and node --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python -m pip install "ruff==0.17.5"
      - run: ruff check
      # The runner's own Node is enough for a syntax check. nullglob: static/js may not exist yet.
      - name: node --check static/js/*.js
        run: |
          shopt -s nullglob
          node --version
          for f in static/js/*.js; do node --check "$f"; done

  shellcheck:
    name: shellcheck (sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ubuntu-latest ships shellcheck.
      - run: shellcheck -s sh installer/setup-head.sh installer/build.sh ops/tracker-backup

  alpine:
    # The container runs on Alpine's own py3-* packages, so test against exactly those.
    name: pytest (Alpine packages)
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      # git so actions/checkout makes a real clone: tests/test_hygiene.py lists files with `git ls-files`.
      - run: apk add --no-cache python3 py3-flask py3-gunicorn py3-jwt py3-cryptography py3-pytest git sqlite
      - uses: actions/checkout@v7
      - run: python3 -m pytest -q
